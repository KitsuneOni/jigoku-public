services:
  beszel-agent:
    image: henrygd/beszel-agent:0.9.1
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=45876
      - KEY=${BESZEL_KEY}
      - FILESYSTEM=/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data:/extra-filesystems/data:ro

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    cap_add: [ SYS_RAWIO ]
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
    volumes:
      - /run/udev:/run/udev:ro
      - /opt/appdata/scrutiny/config:/opt/scrutiny/config
      - /opt/appdata/scrutiny/influxdb:/opt/scrutiny/influxdb
    environment:
      - COLLECTOR_CRON_SCHEDULE=0 3 * * *
    networks: [ proxy ]

  diun:
    image: crazymax/diun:4.29.0
    container_name: diun
    restart: unless-stopped
    command: serve
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - DIUN_WATCH_SCHEDULE=0 8 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_SCRIPT_CMD=/bin/sh
      - DIUN_NOTIF_NTFY_ENDPOINT=http://192.168.1.11:8080
      - DIUN_NOTIF_NTFY_TOPIC=jigoku-alerts
      - DIUN_NOTIF_NTFY_TOKEN=${NTFY_TOKEN}
    volumes:
      - /opt/appdata/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    external: true
