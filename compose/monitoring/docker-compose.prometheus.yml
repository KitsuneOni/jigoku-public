# Optional Prometheus stack (doc 19). Brought up separately:
#   docker compose -f docker-compose.prometheus.yml up -d
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [ "no-new-privileges:true" ]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - /opt/repo/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/appdata/prometheus:/prometheus
    networks: [ media, proxy ]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [ "no-new-privileges:true" ]
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - /opt/appdata/grafana:/var/lib/grafana
      - /opt/repo/config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [ media, proxy ]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ media ]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ media ]

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.0.1
    container_name: exportarr-radarr
    restart: unless-stopped
    command: ["radarr"]
    environment:
      - PORT=9707
      - URL=http://radarr:7878
      - APIKEY=${RADARR_API_KEY}
    networks: [ media ]

  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:v2.0.1
    container_name: exportarr-sonarr
    restart: unless-stopped
    command: ["sonarr"]
    environment:
      - PORT=9708
      - URL=http://sonarr:8989
      - APIKEY=${SONARR_API_KEY}
    networks: [ media ]

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.0.1
    container_name: exportarr-prowlarr
    restart: unless-stopped
    command: ["prowlarr"]
    environment:
      - PORT=9709
      - URL=http://prowlarr:9696
      - APIKEY=${PROWLARR_API_KEY}
      - PROWLARR__BACKFILL=true
    networks: [ media ]

networks:
  media:
    external: true
  proxy:
    external: true
