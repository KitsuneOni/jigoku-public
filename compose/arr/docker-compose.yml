x-common: &common
  restart: unless-stopped
  security_opt: [ "no-new-privileges:true" ]
  environment: &env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  networks: [ media, proxy ]

services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:1.28.2
    container_name: prowlarr
    volumes:
      - /opt/appdata/prowlarr:/config

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: radarr
    volumes:
      - /opt/appdata/radarr:/config
      - /data:/data

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.10
    container_name: sonarr
    volumes:
      - /opt/appdata/sonarr:/config
      - /data:/data

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.4.5
    container_name: bazarr
    volumes:
      - /opt/appdata/bazarr:/config
      - /data/media:/data/media

  recyclarr:
    <<: *common
    image: ghcr.io/recyclarr/recyclarr:7.4.1
    container_name: recyclarr
    user: ${PUID}:${PGID}
    environment:
      <<: *env
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - /opt/repo/config/recyclarr:/config

  jellyseerr:
    <<: *common
    image: fallenbagel/jellyseerr:2.1.0
    container_name: jellyseerr
    environment:
      <<: *env
      LOG_LEVEL: info
    volumes:
      - /opt/appdata/jellyseerr:/app/config
    ports:
      - "192.168.1.10:5055:5055"
      - "100.118.227.102:5055:5055"
networks:
  media:
    external: true
  proxy:
    external: true
