- Downloads:
    - SABnzbd:
        href: https://sab.{{HOMEPAGE_VAR_DOMAIN}}
        icon: sabnzbd.png
        description: Usenet — primary
        widget:
          type: sabnzbd
          url: http://sabnzbd:8080
          key: "{{HOMEPAGE_VAR_SAB_KEY}}"

    - qBittorrent:
        href: https://qbit.{{HOMEPAGE_VAR_DOMAIN}}
        icon: qbittorrent.png
        description: Torrents — behind VPN
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"

