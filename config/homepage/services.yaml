- Clocks:
    - World:
        widget:
          type: iframe
          src: /clocks/index.html
          classes: h-40
          referrerPolicy: same-origin
- Calendar:
    - Agenda:
        widget:
          type: calendar
          view: monthly
          maxEvents: 10
          showTime: true
          integrations:
            - type: ical
              url: http://homepage:3000/calendars/uni.ics
              name: Uni
              color: purple
            - type: ical
              url: http://homepage:3000/calendars/assignments.ics
              name: Assignments
              color: red
            - type: ical
              url: http://homepage:3000/calendars/personal.ics
              name: Personal
              color: blue
    - Upcoming:
        widget:
          type: calendar
          view: agenda
          maxEvents: 6
          showTime: true
          previousDays: 3
          integrations:
            - type: ical
              url: http://homepage:3000/calendars/uni.ics
              name: Uni
              color: purple
            - type: ical
              url: http://homepage:3000/calendars/assignments.ics
              name: Assignments
              color: red
            - type: ical
              url: http://homepage:3000/calendars/personal.ics
              name: Personal
              color: blue
- Media:
    - Jellyfin:
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        icon: jellyfin.png
        description: Movies, TV, music
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Jellyseerr:
        href: https://requests.{{HOMEPAGE_VAR_DOMAIN}}
        icon: jellyseerr.png
        description: Request titles
        widget:
          type: jellyseerr
          url: http://jellyseerr:5055
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"

    - Audiobookshelf:
        href: https://books.{{HOMEPAGE_VAR_DOMAIN}}
        icon: audiobookshelf.png
        description: Audiobooks and podcasts

