global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: jigoku

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: jigoku

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: jigoku

  - job_name: radarr
    static_configs:
      - targets: ['exportarr-radarr:9707']

  - job_name: sonarr
    static_configs:
      - targets: ['exportarr-sonarr:9708']

  - job_name: prowlarr
    static_configs:
      - targets: ['exportarr-prowlarr:9709']
