# Authelia — SSO for example.com admin services.
# Family-facing services are deliberately NOT behind Authelia: TV and
# mobile clients cannot follow the auth redirect.

theme: dark

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info
  format: text

totp:
  issuer: example.com
  period: 30
  skew: 1

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 5m
  file:
    path: /config/users_database.yml
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain:
        - jellyfin.example.com
        - requests.example.com
        - books.example.com
        - ntfy.example.com
      policy: bypass

    - domain:
        - example.com
        - home.example.com
        - radarr.example.com
        - sonarr.example.com
        - prowlarr.example.com
        - bazarr.example.com
        - sab.example.com
        - qbit.example.com
        - dockge.example.com
        - logs.example.com
        - scrutiny.example.com
        - grafana.example.com
        - tdarr.example.com
        - food.example.com
        - prometheus.example.com
        - adguard.example.com
        - uptime.example.com
        - beszel.example.com
        - backrest.example.com
      subject: 'group:admins'
      policy: two_factor

session:
  name: authelia_session
  same_site: lax
  expiration: 12h
  inactivity: 2h
  remember_me: 1M
  cookies:
    - domain: example.com
      authelia_url: https://auth.example.com
      default_redirection_url: https://example.com

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
